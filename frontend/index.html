<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness Desktop</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0d12;
      color: #e6e8ee;
    }
    .card { text-align: center; }
    .pulse {
      width: 28px; height: 28px; margin: 0 auto 16px;
      border: 3px solid #3b82f6; border-top-color: transparent;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { opacity: 0.7; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="pulse"></div>
    <h1>DeepSeek Harness</h1>
    <p>Starting the harness…</p>
  </div>
  <script>
    // The Rust shell spawns the dsh host, waits for http://127.0.0.1:3080,
    // then navigates this webview to it via window.location.replace(...).
    // No frontend logic is required beyond this splash.
  </script>
</body>
</html>
