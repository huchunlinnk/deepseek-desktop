name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate shell scripts
        run: |
          bash -n scripts/bundle-host.sh
          bash -n scripts/smoke-web.sh

      # tauri-build validates bundle.resources paths at compile time; cargo check
      # only needs the directory to exist, not its (heavy) vendored contents.
      - name: Ensure vendored-host dir exists
        run: mkdir -p vendor/host

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
